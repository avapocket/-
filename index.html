<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Спортивный Клуб — Mini App</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --text-color: #ffffff;
      --btn-color: #2563eb;
      --btn-text: #ffffff;
      --accent-color: #10b981;
    }

    /* Стильный темный фон с градиентными свечениями */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 50%, #070a13 100%);
      background-attachment: fixed;
      color: var(--text-color);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    .container {
      padding: 16px;
      max-width: 440px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 { 
      margin: 0 0 6px 0; 
      font-size: 24px;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    header p { margin: 0; opacity: 0.7; font-size: 13px; }

    /* Панель управления редактором */
    .admin-panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed #3b82f6;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #4b5563; transition: .3s; border-radius: 22px;
    }

    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }

    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Товары в один столбец */
    .column-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    .card h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .price {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 15px;
      margin-bottom: 12px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background-color: var(--btn-color);
      color: var(--btn-text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    button.secondary {
      background-color: rgba(255,255,255,0.1);
      color: var(--text-color);
    }

    button.edit-btn {
      background-color: #f59e0b;
      color: #000;
      flex: 100%;
      margin-top: 4px;
      display: none;
    }

    /* Модальные окна */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .modal-content {
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold;
    }

    .modal img {
      width: 100%; height: 180px;
      object-fit: cover; border-radius: 12px; margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block; font-size: 12px; margin-bottom: 4px; opacity: 0.8;
    }

    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid #374151; background: #0d1117; color: #fff;
      box-sizing: border-box; font-size: 13px;
    }

    /* Нижняя плавающая кнопка */
    .contact-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px;
      display: flex; 
      gap: 10px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🔥 Спорт & Тренировки</h1>
      <p>Выберите программу или свяжитесь с нами</p>
    </header>

    <!-- Переключатель редактора -->
    <div class="admin-panel">
      <span>⚙️ Режим редактирования</span>
      <label class="switch">
        <input type="checkbox" id="adminToggle" onchange="toggleAdminMode()">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Список товаров в 1 столбец по порядку вниз -->
    <div class="column-list" id="productList"></div>
  </div>

  <!-- Кнопка связи -->
  <div class="contact-bar">
    <button onclick="contactAdmin()" style="background-color: #10b981;">💬 Написать в Telegram</button>
  </div>

  <!-- Модальное окно: Подробности -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <div class="close-btn" onclick="closeModal('detailsModal')">✕</div>
      <img id="modalImg" src="" alt="">
      <h2 id="modalTitle" style="margin: 0 0 8px 0; font-size: 18px;"></h2>
      <div class="price" id="modalPrice" style="font-size: 16px;"></div>
      <p id="modalDesc" style="font-size: 13px; opacity: 0.8; line-height: 1.4;"></p>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button id="modalBuyBtn">Купить / Записаться</button>
        <button class="secondary" onclick="contactAdmin()">Спросить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно: Редактирование -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="close-btn" onclick="closeModal('editModal')">✕</div>
      <h3 style="margin-top: 0;">Редактирование товара</h3>
      <input type="hidden" id="editId">
      
      <div class="form-group">
        <label>Название</label>
        <input type="text" id="editTitle">
      </div>
      <div class="form-group">
        <label>Цена (руб / ⭐)</label>
        <input type="text" id="editPrice">
      </div>
      <div class="form-group">
        <label>Ссылка на фото (URL)</label>
        <input type="text" id="editImg">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="editDesc" rows="4"></textarea>
      </div>
      
      <button onclick="saveProduct()" style="background-color: #10b981; margin-top: 10px;">Сохранить изменения</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Замените Beriman1 на ваш username без @
    const MY_TELEGRAM_USERNAME = "Beriman1"; 

    const defaultProducts = [
      { id: 1, title: "1. 🥊 Разовая тренировка", price: "500 ₽ / 500 ⭐", img: "https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=500", desc: "Персональное занятие с тренером, вводный инструктаж и составление плана на первое время." },
      { id: 2, title: "2. 🏋️ Месячный абонемент", price: "3 500 ₽ / 3 500 ⭐", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500", desc: "Безлимитное посещение тренажерного зала в течение 30 дней. Раздевалка и шкафчик включены." },
      { id: 3, title: "3. 🏆 Персональный тренер", price: "8 000 ₽ / 8 000 ⭐", img: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=500", desc: "10 индивидуальных занятий с топ-тренером. Полный контроль техники и питания." },
      { id: 4, title: "4. 🥗 План питания", price: "1 500 ₽ / 1 500 ⭐", img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=500", desc: "Расчет КБЖУ и индивидуальный рацион на 4 недели под ваши цели (похудение / набор массы)." },
      { id: 5, title: "5. 🧘 Йога & Растяжка", price: "2 800 ₽ / 2 800 ⭐", img: "https://images.unsplash.com/photo-1545205597-3d9d02c29597?w=500", desc: "8 групповых занятий по растяжке и восстановлению гибкости суставов." },
      { id: 6, title: "6. 🏊 Бассейн (10 визитов)", price: "4 000 ₽ / 4 000 ⭐", img: "https://images.unsplash.com/photo-1530549387789-4c1017266635?w=500", desc: "10 посещений дорожки 25м + доступ в сауну после плавания." },
      { id: 7, title: "7. ⚡ Онлайн-ведение", price: "5 000 ₽ / 5 000 ⭐", img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500", desc: "Ежедневный контроль отчетов, корректировка тренировок и обратная связь в Telegram." },
      { id: 8, title: "8. 🎁 Подарочный сертификат", price: "5 000 ₽ / 5 000 ⭐", img: "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500", desc: "Сертификат на любую услугу клуба с открытой датой использования." }
    ];

    let products = JSON.parse(localStorage.getItem('my_products')) || defaultProducts;

    function renderProducts() {
      const list = document.getElementById('productList');
      const isAdmin = document.getElementById('adminToggle').checked;
      list.innerHTML = '';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${p.img}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
          <div class="card-body">
            <h3>${p.title}</h3>
            <div class="price">${p.price}</div>
            <div class="btn-group">
              <button onclick="openDetails(${p.id})">Подробнее</button>
              <button class="secondary" onclick="selectProduct('${p.title}')">Заказать</button>
              <button class="edit-btn" style="display: ${isAdmin ? 'block' : 'none'}" onclick="openEdit(${p.id})">✏️ Изменить</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function selectProduct(title) {
      if (tg.initDataUnsafe && tg.initDataUnsafe.query_id) {
        tg.sendData(JSON.stringify({ action: "buy", product: title }));
        tg.close();
      } else {
        alert(`Вы выбрали: ${title}`);
      }
    }

    function openDetails(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;
      document.getElementById('modalImg').src = p.img;
      document.getElementById('modalTitle').innerText = p.title;
      document.getElementById('modalPrice').innerText = p.price;
      document.getElementById('modalDesc').innerText = p.desc;
      
      const buyBtn = document.getElementById('modalBuyBtn');
      buyBtn.onclick = () => {
        closeModal('detailsModal');
        selectProduct(p.title);
      };
      
      document.getElementById('detailsModal').style.display = 'flex';
    }

    function toggleAdminMode() { renderProducts(); }

    function openEdit(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editId').value = p.id;
      document.getElementById('editTitle').value = p.title;
      document.getElementById('editPrice').value = p.price;
      document.getElementById('editImg').value = p.img;
      document.getElementById('editDesc').value = p.desc;

      document.getElementById('editModal').style.display = 'flex';
    }

    function saveProduct() {
      const id = parseInt(document.getElementById('editId').value);
      const p = products.find(item => item.id === id);

      if (p) {
        p.title = document.getElementById('editTitle').value;
        p.price = document.getElementById('editPrice').value;
        p.img = document.getElementById('editImg').value;
        p.desc = document.getElementById('editDesc').value;

        localStorage.setItem('my_products', JSON.stringify(products));
        renderProducts();
        closeModal('editModal');
      }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function contactAdmin() {
      if (MY_TELEGRAM_USERNAME) {
        tg.openTelegramLink(`https://t.me/${MY_TELEGRAM_USERNAME}`);
      } else {
        alert("Укажите username в коде!");
      }
    }

    renderProducts();
  </script>
</body>
</html>
