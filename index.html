<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PRIVATE ROOM</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#080808;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
}

header{
    padding:22px 18px 12px;
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(8,8,8,.94);
    backdrop-filter:blur(18px);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1.5px;
}

.sub{
    margin-top:5px;
    color:#8e8e8e;
    font-size:13px;
}

.categories{
    display:flex;
    gap:8px;
    margin-top:18px;
    overflow-x:auto;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.cat{
    flex:none;
    border:1px solid #292929;
    background:#111;
    color:#999;
    padding:9px 15px;
    border-radius:30px;
    font-size:12px;
    font-weight:700;
}

.cat.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.container{
    padding:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.card{
    background:#111;
    border:1px solid #202020;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
}

.preview{
    height:250px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%,#383838 0%,#151515 35%,#080808 75%);
}

.preview video{
    position:absolute;
    inset:-18%;
    width:136%;
    height:136%;
    object-fit:cover;

    filter:
        blur(23px)
        brightness(.78)
        contrast(1.08);

    transform:scale(1.12);
    opacity:0;
    transition:opacity .5s ease;
}

.preview video.ready{
    opacity:1;
}

.blur-overlay{
    position:absolute;
    inset:0;
    z-index:2;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.18) 45%,
            rgba(0,0,0,.72)
        );
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    z-index:5;

    padding:5px 8px;
    border-radius:7px;

    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.15);

    font-size:9px;
    font-weight:900;
    letter-spacing:.8px;
}

.lock{
    position:absolute;
    z-index:5;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(0,0,0,.58);
    border:1px solid rgba(255,255,255,.22);

    backdrop-filter:blur(8px);

    font-size:20px;
}

.card-info{
    padding:11px 10px 13px;
}

.title{
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.desc{
    color:#777;
    font-size:10px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:11px;
}

.price{
    font-size:13px;
    font-weight:900;
}

.open{
    border:0;
    background:#fff;
    color:#000;
    padding:7px 10px;
    border-radius:8px;
    font-size:10px;
    font-weight:900;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;

    background:rgba(0,0,0,.82);
    backdrop-filter:blur(15px);

    align-items:flex-end;
    justify-content:center;
}

.modal-box{
    width:100%;
    max-width:500px;

    background:#111;
    border:1px solid #292929;
    border-radius:25px 25px 0 0;

    padding:22px 18px 30px;

    animation:up .25s ease;
}

@keyframes up{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.close{
    float:right;
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid #333;
    background:#1b1b1b;
    color:#aaa;
    font-size:18px;
}

.modal-title{
    font-size:21px;
    font-weight:900;
    margin-top:6px;
}

.modal-desc{
    color:#888;
    font-size:13px;
    line-height:1.5;
    margin-top:7px;
}

.hot-text{
    margin-top:18px;
    padding:13px;
    border-radius:13px;
    background:#191919;
    border:1px solid #292929;

    color:#d0d0d0;
    font-size:12px;
    line-height:1.45;
}

.payment{
    margin-top:16px;
}

.label{
    color:#777;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.card-number{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:7px;
    padding:13px;

    border-radius:11px;
    background:#080808;
    border:1px solid #282828;

    font-size:16px;
    font-weight:800;
    letter-spacing:1px;
}

.copy{
    background:#222;
    color:#fff;
    border:0;
    padding:8px 10px;
    border-radius:7px;
    font-size:10px;
}

.pay-btn{
    width:100%;
    margin-top:14px;
    padding:15px;

    border:0;
    border-radius:12px;

    background:#fff;
    color:#000;

    font-weight:900;
    font-size:14px;
}

.telegram{
    width:100%;
    margin-top:9px;
    padding:13px;

    border:1px solid #303030;
    border-radius:12px;

    background:#171717;
    color:#fff;

    font-weight:800;
}

.timer{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-top:12px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#666;
}
</style>
</head>

<body>

<header>
    <div class="logo">PRIVATE ROOM</div>
    <div class="sub">Закрытая коллекция • Только для своих</div>

    <div class="categories">
        <button class="cat active" onclick="filterVideos('all',this)">ВСЁ</button>
        <button class="cat" onclick="filterVideos('new',this)">NEW</button>
        <button class="cat" onclick="filterVideos('hot',this)">HOT</button>
        <button class="cat" onclick="filterVideos('vip',this)">VIP</button>
    </div>
</header>

<main class="container">
    <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal" onclick="outside(event)">
    <div class="modal-box">

        <button class="close" onclick="closeModal()">×</button>

        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-desc" id="modalDesc"></div>

        <div class="hot-text" id="modalText"></div>

        <div class="payment">

            <div class="label">Стоимость доступа</div>

            <div class="card-number">
                <span id="modalPrice"></span>
            </div>

            <div class="label" style="margin-top:14px">
                Перевод на карту
            </div>

            <div class="card-number">
                <span>2200 7021 9498 5615</span>
                <button class="copy" onclick="copyCard()">КОПИРОВАТЬ</button>
            </div>

            <button class="pay-btn" onclick="paid()">
                Я ОПЛАТИЛ
            </button>

            <button class="telegram" onclick="telegram()">
                НАПИСАТЬ АДМИНУ
            </button>

            <div class="timer">
                Ссылка на доступ будет активна после подтверждения оплаты
            </div>

        </div>
    </div>
</div>

<script>

const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

/*
==================================================
ВАЖНО:
КЛАДИ ВИДЕО В ПАПКУ videos

Например:

videos/video1.mp4
videos/video2.mp4
videos/video3.mp4

Именно такие имена указывай ниже.
==================================================
*/

const videos = [

    {
        id:1,
        title:"AFTER DARK",
        category:"new",
        badge:"NEW",
        price:500,
        video:"videos/video1.mp4",
        desc:"Новая приватная запись",
        text:"Тёмная атмосфера, близкий кадр и ощущение настоящего private moment."
    },

    {
        id:2,
        title:"MIDNIGHT",
        category:"hot",
        badge:"HOT",
        price:700,
        video:"videos/video2.mp4",
        desc:"Ночной приватный момент",
        text:"Такие моменты не выставляют напоказ. Только для тех, кто получил доступ."
    },

    {
        id:3,
        title:"PRIVATE MOOD",
        category:"hot",
        badge:"HOT",
        price:700,
        video:"videos/video3.mp4",
        desc:"Закрытая запись",
        text:"Тихая ночь, приглушённый свет и та самая атмосфера, которую хочется пересмотреть."
    },

    {
        id:4,
        title:"SECRET ROOM",
        category:"new",
        badge:"NEW",
        price:900,
        video:"videos/video4.mp4",
        desc:"Секретная коллекция",
        text:"Кадры, которые остаются только между своими."
    },

    {
        id:5,
        title:"DARK DESIRE",
        category:"hot",
        badge:"HOT",
        price:1000,
        video:"videos/video5.mp4",
        desc:"Особая запись",
        text:"Больше атмосферы. Больше интриги. Меньше лишних слов."
    },

    {
        id:6,
        title:"PRIVATE NIGHT",
        category:"vip",
        badge:"VIP",
        price:1200,
        video:"videos/video6.mp4",
        desc:"VIP collection",
        text:"Эксклюзивный материал для тех, кто хочет попасть глубже в закрытую коллекцию."
    },

    {
        id:7,
        title:"NO LIGHTS",
        category:"vip",
        badge:"VIP",
        price:1400,
        video:"videos/video7.mp4",
        desc:"Dark collection",
        text:"Только силуэты, настроение и полная атмосфера закрытой комнаты."
    },

    {
        id:8,
        title:"SECRET TAPE",
        category:"vip",
        badge:"VIP",
        price:1600,
        video:"videos/video8.mp4",
        desc:"Private archive",
        text:"Архивная запись из закрытой коллекции."
    }

];

let currentProduct = null;
let currentFilter = "all";

function render(){

    const grid = document.getElementById("grid");

    let list = videos.filter(v =>
        currentFilter === "all" || v.category === currentFilter
    );

    if(!list.length){
        grid.innerHTML = `<div class="empty">В этой категории пока ничего нет</div>`;
        return;
    }

    grid.innerHTML = list.map(video => `

        <div class="card" onclick="openModal(${video.id})">

            <div class="preview">

                <video
                    src="${video.video}"
                    muted
                    autoplay
                    loop
                    playsinline
                    preload="metadata"
                ></video>

                <div class="blur-overlay"></div>

                <div class="badge">${video.badge}</div>

                <div class="lock">🔒</div>

            </div>

            <div class="card-info">

                <div class="title">${video.title}</div>

                <div class="desc">
                    ${video.desc}
                </div>

                <div class="bottom">

                    <div class="price">
                        ${video.price} сом
                    </div>

                    <button class="open">
                        ОТКРЫТЬ
                    </button>

                </div>

            </div>

        </div>

    `).join("");

    document.querySelectorAll(".preview video").forEach(video => {

        video.addEventListener("loadeddata", () => {
            video.classList.add("ready");
            video.play().catch(()=>{});
        });

        video.addEventListener("error", () => {
            /*
            Если видео не найдено,
            оставляем красивый фон вместо
            полностью чёрного квадрата.
            */
            video.style.display = "none";
        });

    });

}

function filterVideos(category,button){

    currentFilter = category;

    document.querySelectorAll(".cat")
        .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    render();
}

function openModal(id){

    currentProduct = videos.find(v => v.id === id);

    if(!currentProduct) return;

    document.getElementById("modalTitle").textContent =
        currentProduct.title;

    document.getElementById("modalDesc").textContent =
        currentProduct.desc;

    document.getElementById("modalText").textContent =
        currentProduct.text;

    document.getElementById("modalPrice").textContent =
        currentProduct.price + " сом";

    document.getElementById("modal").style.display = "flex";

}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function outside(e){

    if(e.target.id === "modal"){
        closeModal();
    }

}

function copyCard(){

    navigator.clipboard.writeText("2200702194985615");

    alert("Номер карты скопирован");

}

function telegram(){

    window.open(
        "https://t.me/PREMDOSTUP",
        "_blank"
    );

}

function paid(){

    if(!currentProduct) return;

    const user =
        tg?.initDataUnsafe?.user || {};

    const paymentData = {

        action:"payment_submitted",

        product_id:currentProduct.id,

        product:currentProduct.title,

        price:currentProduct.price,

        user_id:user.id || null,

        username:user.username || null,

        first_name:user.first_name || null,

        timestamp:new Date().toISOString()

    };

    if(tg && tg.sendData){

        tg.sendData(
            JSON.stringify(paymentData)
        );

    }

    alert(
        "Заявка отправлена. После проверки оплаты администратор выдаст доступ."
    );

    closeModal();

}

render();

</script>

</body>
</html>
